<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% extends "base.html" %}
{% block content %}
<h2>Удалить категорию</h2>

<p>Вы уверены, что хотите удалить категорию "{{ category.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:category_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}


</body>
</html>
