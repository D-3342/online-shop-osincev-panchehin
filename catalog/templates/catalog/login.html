<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: #f0f2f5;
            color: #1f2937;
            line-height: 1.5;
        }

        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #002a77;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 10px 16px;
            background: #002a77;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-btn:hover {
            background: #001e5c;
        }

        .error {
            color: #d9480f;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .go-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .go-links a {
            color: #007bff;
            text-decoration: none;
        }

        .go-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <h1 class="login-title">Вход в {{ title }}</h1>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required />
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required />
            </div>

            <button type="submit" class="submit-btn">Войти</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="go-links">
            <p>
                <a href="{% url 'catalog:registration' %}">Нет аккаунта? Зарегистрироваться</a>
            </p>
        </div>
    </div>

</body>
</html>
