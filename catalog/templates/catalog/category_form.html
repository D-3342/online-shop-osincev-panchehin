<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label form="{{ form.name.id_for_label }}" class="form-label">Название</label>
        {{ form.name }}
    </div>
    <div class="mb-3">
        <label form="{{ form.slug.id_for_label }}" class="form-label">Slug</label>
        {{ form.slug }}
    </div>
    <div class="mb-3">
        <label form="{{ form.description.id_for_label }}" class="form-label">Описание</label>
        {{ form.description }}
    </div>
    <div class="mb-3 form-check">
        {{ form.is_active }}
        <label form="{{ form.is_active.id_for_label }}" class="form-check-label">Активна</label>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'catalog:category_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}


</body>
</html>
