<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Slug</th>
            <th>Описание</th>
            <th>Статус</th>
            <th>Создано</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categories %}
        <tr>
            <td>{{ cat.id }}</td>
            <td>{{ cat.name }}</td>
            <td>{{ cat.slug }}</td>
            <td>{{ cat.description|truncatechars:50 }}</td>
            <td>
                <span class="badge bg-{{ cat.is_active|yesno:'success,secondary' }}">
                    {{ cat.get_is_active_display }}
                </span>
            </td>
            <td>{{ cat.created_at|date:"d.m.Y H:i" }}</td>
            <td>
                <a href="{% url 'catalog:category_update' cat.pk %}" class="btn btn-sm btn-outline-primary">
                    Редактировать
                </a>
                <a href="{% url 'catalog:category_delete' cat.pk %}" class="btn btn-sm btn-outline-danger">
                    Удалить
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7" class="text-center">Категорий нет</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
